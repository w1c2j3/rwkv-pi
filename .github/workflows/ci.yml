name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r inference/requirements.txt
      - run: python -m unittest discover -s test -p test_xml_protocol.py -v
      # data_pipeline.test_pipeline/test_products write only to the mounted F: data root by design; run them locally.
      - run: python -B -m unittest discover -s rwkvdata/tests -t . -v
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node --test data_pipeline/test_delegation.mjs
      - run: npm run pi:setup
        if: matrix.node == 22
      - run: npm run test:source
        if: matrix.node == 22
